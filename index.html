<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interview Preparation</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6fa;color:#17191f}.head{background:#17191f;color:white;padding:28px 18px}.wrap{max-width:1050px;margin:auto}.head h1{margin:0;font-size:30px}.head p{color:#c5c8d0}.grid{display:grid;grid-template-columns:220px 1fr;gap:18px;padding:20px}.side,.main{background:white;border:1px solid #e1e3e8;border-radius:15px}.side{padding:10px;height:max-content;position:sticky;top:10px}.side button{display:block;width:100%;border:0;background:white;text-align:left;padding:12px;border-radius:9px;cursor:pointer}.side button:hover,.side .on{background:#eef0ff;color:#4038c9;font-weight:bold}.main{padding:28px}.search{width:calc(100% - 40px);margin:20px;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}.badge{font-size:12px;background:#eef0ff;color:#4038c9;padding:5px 9px;border-radius:20px}.topic{border-top:1px solid #e8e9ed;padding:22px 0}.topic:first-of-type{border-top:0}.label{font-size:11px;font-weight:bold;letter-spacing:.08em;color:#737985;text-transform:uppercase;margin:9px 0}.ans{font-size:17px;line-height:1.6}.short{background:#fff8df;border-left:4px solid #d3a900;padding:13px 15px;border-radius:7px;line-height:1.5}.ex{background:#f4f5f7;padding:13px 15px;border-radius:8px;line-height:1.5}h2{font-size:28px}h3{font-size:20px;margin:0 0 8px}@media(max-width:720px){.grid{grid-template-columns:1fr;padding:12px}.side{position:static}.main{padding:20px}.head h1{font-size:25px}}</style></head><body><header class="head"><div class="wrap"><h1>📚 Interview Preparation</h1><p>Learn → understand → remember → revise</p></div></header><div class="wrap"><input class="search" id="search" placeholder="Search topics..."></div><div class="wrap grid"><aside class="side" id="nav"></aside><main class="main" id="main"></main></div><script>const T=[{k:'python',n:'Python Basics',c:'Programming',a:[['What is Python?','Python is a high-level, interpreted, general-purpose programming language known for readable syntax.','Python = simple syntax + interpreted + general-purpose.','Used for automation, web development, data analysis and AI/ML.'],['Variables','A variable is a name that refers to a value. Python is dynamically typed, so the type does not have to be declared separately.','Variable = name pointing to a value.','x=10; name="Ram"'],['Data Types','Common built-in types include int, float, str, bool, list, tuple, set, dict and NoneType.','Numbers + text + True/False + collections + None.','age=20; marks=[80,90]'],['Input and Output','input() reads user input as a string and print() displays output.','input = take; print = show.','name=input("Name: "); print(name)'],['Type Conversion','Type conversion changes a value from one type to another using functions such as int(), float(), str() and bool().','Convert using the type name.','int("25") gives 25'],['Operators','Python has arithmetic, comparison, logical, assignment, membership and identity operators.','Calculate → compare → combine → check membership/identity.','+, -, *, /, //, %, **; ==, !=; and, or, not; in, is'],['if / elif / else','Conditional statements choose which block runs based on conditions.','if = check; elif = another check; else = otherwise.','if marks>=40: print("Pass") else: print("Fail")'],['for Loop','A for loop iterates through items of an iterable such as a list, string or range.','for = visit each item.','for x in [1,2,3]: print(x)'],['while Loop','A while loop repeats while its condition is true.','while = repeat while true.','while n>0: n-=1'],['range()','range() generates a sequence commonly used in loops; the stop value is excluded.','range(start,stop,step) → stop NOT included.','range(1,5) gives 1,2,3,4'],['break / continue / pass','break stops a loop, continue skips the current iteration, and pass is a placeholder that does nothing.','break = stop; continue = skip; pass = do nothing.','Use break when the required item is found.'],['Strings','A string is a sequence of characters supporting indexing, slicing, iteration and string methods.','String = characters in sequence.','s="python"; s[0]="p"; s[1:4]="yth"'],['Lists','A list is an ordered, mutable collection and can contain duplicates.','List = ordered + changeable.','a=[10,20,20]; a.append(30)'],['Tuples','A tuple is an ordered, immutable collection.','Tuple = ordered + cannot change.','t=(10,20,30)'],['Sets','A set is an unordered collection of unique elements.','Set = unique values.','set([1,1,2,3]) → {1,2,3}'],['Dictionaries','A dictionary stores data as key-value pairs and uses keys to access values.','Dictionary = key → value.','student={"name":"Ram","age":20}'],['enumerate()','enumerate() gives both the index and value while iterating.','enumerate = index + value.','for i,x in enumerate(a): print(i,x)'],['Functions','A function is a reusable block of code designed to perform a task.','Function = write once, use many times.','def add(a,b): return a+b'],['Parameters and Arguments','A parameter is defined in a function; an argument is the actual value passed during the call.','Parameter = placeholder; argument = actual value.','def add(a,b) → parameters; add(2,3) → arguments'],['return','return sends a value from a function back to its caller and ends that function execution.','return = send back.','return a+b'],['*args','*args allows a function to accept a variable number of positional arguments.','*args = many positional values.','def total(*args): return sum(args)'],['**kwargs','**kwargs allows a function to accept a variable number of keyword arguments.','**kwargs = many named values.','def show(**kwargs): print(kwargs)'],['Lambda','A lambda is a small anonymous function written as a single expression.','lambda = short one-line function.','square=lambda x:x*x'],['Recursion','Recursion is when a function calls itself; a base case is needed to stop the calls.','Recursion = calls itself + base case.','factorial(n) calls factorial(n-1) until the base case.'],['Exception Handling','Exception handling manages runtime errors using try, except, else and finally.','try = risky code; except = handle; finally = end cleanup.','try: x=10/0 except ZeroDivisionError: print("Error")'],['Python Interview Revision','Know Python basics, dynamic typing, collections, loops, functions, *args/**kwargs, lambda, recursion and exceptions.','Data → Conditions → Loops → Collections → Functions → Errors.','Common questions: list vs tuple, list vs set, list vs dictionary, *args vs **kwargs, parameter vs argument.']]},{k:'oops',n:'OOP Concepts',c:'Programming',a:[['What is OOP?','OOP is a programming approach where programs are organized around objects containing data and methods.','Real-world things → Objects → Data + Actions.','Student object: name, age and study().'],['Class','A class is a blueprint or template used to create objects.','Class = blueprint.','Student is a class; s1=Student("Ram") is an object.'],['Object','An object is an instance of a class.','Class = blueprint; object = actual instance.','s1=Student("Ram")'],['Constructor','A constructor initializes an object when it is created. Python uses __init__() for initialization.','Constructor = setup when object is born.','def __init__(self,name): self.name=name'],['self','self refers to the current object and lets it access its own attributes and methods.','self = current object.','For s1=Student("Ram"), self refers to s1 inside its method.'],['Parameter vs Attribute','In self.name=name, name is the parameter and self.name is the attribute stored in the current object.','name = incoming value; self.name = stored value.','Student("Ram") stores "Ram" in that object.'],['Encapsulation','Encapsulation bundles related data and methods and controls access to internal data.','Encapsulation = bundle + protect/control access.','BankAccount keeps balance with deposit() and withdraw().'],['Abstraction','Abstraction hides unnecessary implementation details and exposes only required functionality.','Abstraction = hide complexity; show essentials.','ATM: withdraw without knowing internal transaction processing.'],['Encapsulation vs Abstraction','Encapsulation focuses on data bundling/access control; abstraction focuses on hiding implementation complexity.','Encapsulation → DATA/control. Abstraction → IMPLEMENTATION/complexity.','ATM access/control vs hidden internal transaction process.'],['Inheritance','Inheritance lets a child class reuse and extend a parent class.','Inheritance = reuse parent.','Dog inherits eat() from Animal and adds bark().'],['Inheritance Types','Common types: Single, Multilevel, Multiple, Hierarchical and Hybrid.','Single A→B; Multilevel A→B→C; Multiple A+B→C; Hierarchical A→B,C; Hybrid = combination.','Animal→Dog is single; Animal→Dog and Animal→Cat is hierarchical.'],['Method Overriding','A child class provides its own implementation of an inherited parent method.','Overriding = child changes parent behavior.','Dog.sound() can replace Animal.sound().'],['Method Overloading','Same method name with different parameter lists. Python does not support traditional compile-time overloading like Java.','Overloading = same name, different inputs.','Java add(a,b) and add(a,b,c); Python commonly uses default args or *args.'],['Polymorphism','The same interface or method call can produce different behavior depending on the object.','Poly = many; morph = forms.','Dog.sound() → Bark; Cat.sound() → Meow.'],['Duck Typing','Python cares about usable behavior more than exact object type.','If it can do the job, use it.','animal.sound() works with Dog or Cat if both provide sound().'],['super()','super() accesses parent-class methods or the parent constructor from a child.','super() = go to my parent.','super().__init__(name) calls the parent constructor.'],['Abstract Class','An abstract class gives common structure and can contain abstract methods subclasses must implement.','Abstract class = common structure + required behavior.','Animal can require every child to implement sound().'],['Interface','In Java, an interface acts as a contract that implementing classes must follow.','Interface = contract.','Vehicle can require start(); Car and Bike implement it.'],['OOP Interview Revision','Be ready for the four pillars, class vs object, constructor, self, super(), inheritance types, overriding vs overloading, polymorphism and abstraction vs encapsulation.','Four pillars: Encapsulation → Abstraction → Inheritance → Polymorphism.','Typical questions: What is OOP? Difference between abstraction and encapsulation? What is overriding? What does super() do?']]},{k:'dbms',n:'DBMS',c:'CS Core',a:[['Coming Next','DBMS will be added when we complete it together.','Learn → understand → remember → revise.','']]},{k:'sql',n:'SQL',c:'CS Core',a:[['Coming Next','SQL will be added when we complete it together.','Learn → understand → remember → revise.','']]},{k:'dsa',n:'DSA',c:'DSA',a:[['Coming Next','DSA topics will be added as we complete them.','Learn → understand → remember → revise.','']]},{k:'os',n:'Operating Systems',c:'CS Core',a:[['Coming Next','OS will be added when we complete it.','Learn → understand → remember → revise.','']]},{k:'cn',n:'Computer Networks',c:'CS Core',a:[['Coming Next','CN will be added when we complete it.','Learn → understand → remember → revise.','']]},{k:'projects',n:'Projects',c:'Resume',a:[['Coming Next','Project interview preparation will be added here.','Problem → explanation → workflow → technologies → interview answer.','']]},{k:'hr',n:'HR Interview',c:'Interview',a:[['Coming Next','HR preparation will be added here.','Question → strong answer → remember points → example.','']]}];let nav=document.getElementById('nav'),main=document.getElementById('main');function renderNav(q=''){nav.innerHTML='';T.filter(t=>(t.n+t.c).toLowerCase().includes(q.toLowerCase())).forEach(t=>{let b=document.createElement('button');b.textContent=(t.k==='python'||t.k==='oops'?'✓ ':'○ ')+t.n;b.onclick=()=>show(t.k);b.id='b'+t.k;nav.appendChild(b)})}function show(k){let t=T.find(x=>x.k===k)||T[0];document.querySelectorAll('.side button').forEach(b=>b.classList.remove('on'));document.getElementById('b'+k)?.classList.add('on');let o='<span class="badge">'+t.c+'</span><h2>'+t.n+'</h2>';t.a.forEach((x,i)=>{o+='<section class="topic"><h3>'+(i+1)+'. '+x[0]+'</h3><div class="label">Definition / Interview Answer</div><div class="ans">'+x[1]+'</div><div class="label">Shortcut to Remember</div><div class="short">'+x[2]+'</div>'+(x[3]?'<div class="label">Example</div><div class="ex">'+x[3]+'</div>':'')+'</section>'});main.innerHTML=o}document.getElementById('search').oninput=e=>renderNav(e.target.value);renderNav();show('python');</script></body></html>
